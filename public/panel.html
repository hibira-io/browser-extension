<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hibi</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header>
  <img src="hibi.png" alt="" class="avatar" width="36" height="36">
  <div class="who"><strong>Hibi</strong><span id="site" class="site"></span></div>
  <button id="menu" class="icon" type="button" data-tip="account" aria-label="Account">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  </button>
</header>
<div id="account" class="account" hidden></div>
<main id="log" aria-live="polite"></main>
<section id="gate" class="gate" hidden></section>
<form id="ask" class="ask" hidden>
  <div id="folder" class="folder" hidden><span id="folderName"></span><button id="folderOff" type="button" class="chipx" data-tip="" aria-label="">✕</button></div>
  <button id="folderBtn" type="button" class="icon" data-tip="" aria-label="">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2h8.4A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
  </button>
  <textarea id="input" rows="2"></textarea>
  <button id="send" type="submit" class="icon primary" aria-label="Send">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 12l16-8-6 16-2-7z" fill="currentColor"/></svg>
  </button>
  <button id="stop" type="button" class="icon" aria-label="Stop" hidden>
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
  </button>
</form>
<footer id="meter" class="meter"></footer>
<script src="panel.js" type="module"></script>
</body>
</html>
